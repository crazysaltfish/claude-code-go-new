<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Claude Code · Workspace</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script><script src="/agent-apps.js" defer></script><script src="/workspace.js" defer></script></head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="brand"><span class="brand-mark"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#brand"></use></svg></span><span class="brand-name">Claude Code</span><button class="icon-button" id="close-sidebar" aria-label="收起侧栏" title="收起侧栏"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#sidebar"></use></svg></button></div>
  <button class="new-chat" id="new-chat"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#plus"></use></svg> <span>新对话</span> <kbd>⌘ K</kbd></button>
  <label class="search-wrap"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg><input id="search" aria-label="搜索对话" placeholder="搜索对话"></label>
  <button class="nav-item" id="project-button" aria-controls="project-panel" aria-expanded="false"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#folder"></use></svg> 项目空间 <span class="subtle">本地</span></button>
  <button class="nav-item" id="tasks-button" aria-controls="task-panel" aria-expanded="false"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#tasks"></use></svg> 子 Agent 任务 <span id="task-count" class="count">0</span></button>
  <div class="list-label">最近对话 <span id="chat-total"></span></div>
  <nav id="chat-list" aria-label="历史对话"></nav>
  <footer class="sidebar-footer"><div class="avatar"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#folder"></use></svg></div><div><strong>本地工作空间</strong><small id="project-name">正在连接…</small></div><span class="connection-dot" id="connection-dot" title="连接状态"></span></footer>
</aside>
<div class="workspace">
  <header class="topbar">
    <div class="header-left">
      <button class="icon-button" id="toggle-sidebar" aria-label="展开或收起侧栏" aria-controls="sidebar" title="展开或收起侧栏"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#sidebar"></use></svg></button>
      <h1 id="chat-title">新对话</h1>
    </div>
    <div class="header-actions">
      <button class="icon-button" id="export-chat" aria-label="导出对话" title="导出为 Markdown"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#download"></use></svg></button>
      <div class="panel-tools">
        <button class="icon-button" id="toggle-project" aria-label="项目空间" aria-controls="project-panel" aria-expanded="false" title="项目空间"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#folder"></use></svg></button>
        <button class="icon-button" id="toggle-tasks" aria-label="显示任务面板" aria-controls="task-panel" aria-expanded="false" title="任务面板"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#tasks"></use></svg></button>
        <button class="icon-button" id="toggle-apps" aria-label="扩展应用" aria-controls="app-panel" aria-expanded="false" title="扩展应用"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#apps"></use></svg></button>
      </div>
    </div>
  </header>
  <main id="scroll-area"><div class="conversation" id="conversation"><section id="welcome" class="welcome"><div class="welcome-mark"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#brand"></use></svg></div><h2>一起把想法，变成代码。</h2><p>探索项目、实现功能，或把复杂工作交给子 Agent。</p><div class="suggestions"><button data-prompt="帮我梳理这个项目的架构和核心执行流程"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#folder"></use></svg><strong>理解项目</strong><small>梳理架构与核心流程</small></button><button data-prompt="检查当前项目的改动，指出值得关注的问题"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#code"></use></svg><strong>审查改动</strong><small>发现代码中的细节</small></button><button data-prompt="启动两个后台子 Agent，分别分析项目架构和测试覆盖，结束后汇总建议"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#tasks"></use></svg><strong>并行探索</strong><small>让子 Agent 协作分析</small></button></div></section></div></main>
  <div class="composer-area"><div id="approvals" aria-live="polite"></div><div id="run-status" class="run-status" role="status"></div><form id="composer"><textarea id="prompt" rows="2" aria-label="输入消息" placeholder="有什么想一起完成的？" maxlength="100000"></textarea><div class="composer-toolbar"><div class="composer-meta"><span class="model-chip"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#brand"></use></svg><span id="model-label">连接中</span></span><span class="project-chip" id="project-chip"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#folder"></use></svg><span id="project-chip-label">本地项目</span></span></div><button type="submit" class="send-button" id="send" disabled><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#send"></use></svg><span>发送</span></button><button type="button" class="stop-button hidden" id="stop"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#stop"></use></svg><span>停止</span></button></div></form><div class="composer-caption"><span>Enter 发送 · Shift + Enter 换行</span></div></div>
</div>
<aside id="task-panel" class="task-panel side-panel hidden" aria-labelledby="task-panel-title">
  <header class="panel-header"><h2 id="task-panel-title"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#tasks"></use></svg> 子 Agent 任务</h2><button class="icon-button" id="close-tasks" aria-label="关闭任务面板" title="关闭任务面板"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg></button></header>
  <div class="task-panel-body">
    <div class="task-filter-heading"><span>会话任务</span><span id="running-count">0 个运行中</span></div>
    <div id="task-list"><p class="empty-tasks">还没有子 Agent 任务。</p></div>
  </div>
</aside>
<aside id="project-panel" class="project-panel side-panel hidden" aria-labelledby="project-panel-title">
  <header class="panel-header">
    <h2 id="project-panel-title"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#folder"></use></svg> 项目空间</h2>
    <div><button type="button" class="icon-button" id="reload-project" aria-label="刷新目录" title="刷新目录"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#refresh"></use></svg></button><button type="button" class="icon-button" id="close-project" aria-label="关闭项目空间" title="关闭项目空间"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg></button></div>
  </header>
  <div class="project-browser">
    <section class="project-directory" aria-labelledby="directory-title">
      <div class="project-directory-heading">
        <nav id="directory-crumbs" class="directory-crumbs" aria-label="目录路径"></nav>
        <h3 id="directory-title">会话目录</h3>
        <p id="directory-path" class="directory-path"></p>
        <p id="directory-description" class="directory-description"></p>
        <div class="directory-controls">
          <label class="directory-search"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg><input type="search" id="directory-search" aria-label="搜索文件名称" placeholder="搜索名称"></label>
          <select id="directory-sort" aria-label="文件排序"><option value="name">按名称</option><option value="modified">最近修改</option></select>
        </div>
      </div>
      <div class="directory-results">
        <p id="directory-status" role="status"></p>
        <table aria-label="目录文件" id="directory-table">
          <thead><tr><th scope="col">名称</th><th scope="col">修改时间</th></tr></thead>
          <tbody id="directory-files"></tbody>
        </table>
      </div>
    </section>
    <nav class="project-tree" aria-labelledby="project-tree-title">
      <h3 id="project-tree-title">目录</h3>
      <ul id="project-tree-list"></ul>
    </nav>
  </div>
</aside>
<aside id="app-panel" class="app-panel side-panel hidden" aria-label="扩展应用">
  <header class="panel-header app-panel-header">
    <nav class="app-tabs" id="app-tabs" aria-label="应用页面">
      <button type="button" class="app-tab" id="app-catalog-tab" aria-current="page"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#apps"></use></svg> 扩展应用</button>
    </nav>
    <div class="app-panel-controls">
      <button type="button" class="icon-button" id="reload-app" aria-label="刷新" title="刷新"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#refresh"></use></svg></button>
      <button type="button" class="icon-button" id="expand-app" aria-label="扩大应用面板" title="扩大应用面板" aria-pressed="false"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#expand"></use></svg></button>
      <button type="button" class="icon-button" id="close-app-panel" aria-label="关闭扩展应用" title="关闭扩展应用"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg></button>
    </div>
  </header>
  <section id="app-catalog" class="app-catalog" aria-labelledby="app-catalog-title">
    <h2 id="app-catalog-title">已安装应用</h2>
    <label class="app-search"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg><input type="search" id="app-search" aria-label="搜索已安装应用" placeholder="搜索已安装应用"></label>
    <p id="app-catalog-status" class="app-catalog-status" role="status"></p>
    <ul id="app-list" class="app-list"></ul>
  </section>
  <p id="app-launch-status" class="app-launch-status hidden" role="status"></p>
  <div id="app-frames" class="app-frames hidden"></div>
</aside>
<dialog id="app-detail" aria-labelledby="app-detail-title">
  <div class="dialog-heading"><h2 id="app-detail-title">应用详情</h2><form method="dialog"><button class="icon-button" aria-label="关闭应用详情" autofocus><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg></button></form></div>
  <p id="app-detail-description"></p>
  <p id="app-detail-status" role="status"></p>
  <dl id="app-detail-fields"></dl>
</dialog>
<dialog id="agent-detail" aria-labelledby="agent-detail-title">
  <header class="agent-detail-header">
    <div><p class="eyebrow">子 Agent 详情</p><h2 id="agent-detail-title">任务详情</h2></div>
    <button class="icon-button" id="close-agent-detail" aria-label="关闭子 Agent 详情" autofocus><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg></button>
  </header>
  <div id="agent-detail-body" aria-busy="false"></div>
</dialog>
<div id="toast" role="alert" class="toast hidden"></div>
</body></html>
